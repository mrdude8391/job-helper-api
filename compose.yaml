services:
  db:
    image: postgres:18
    container_name: job-helper-db
    environment:
      POSTGRES_DB: job_helper
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

volumes:
  postgres_data:
